# Local development infrastructure only; no production deployment configuration.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hospital_ai
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
    ports: ["5432:5432"]
    volumes:
      - hospital_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  hospital_pgdata:
