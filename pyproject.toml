[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[project]
name = "hospital-voice-ai"
version = "0.1.0"
description = "Production-minded hospital voice assistant with FastAPI, PostgreSQL, LangGraph and Cartesia"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "websockets>=14,<16",
  "langgraph>=0.4,<1",
  "langchain-openai>=0.3,<1",
  "openai>=1.60,<3",
  "prometheus-client>=0.21,<1",
  "python-json-logger>=3,<4",
  "tenacity>=9,<10",
  "orjson>=3.10,<4",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2", "respx>=0.22,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"] # FastAPI Depends pattern; long safety copy is intentionally intact.
